services:
  - type: web
    name: discord-ticket-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: PYTHON_VERSION
        value: 3.9.0
    autoDeploy: true
    healthCheckPath: /health
